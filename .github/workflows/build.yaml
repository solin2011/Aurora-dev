name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - linux
          - macos
      env_type:
        description: 'Environment type'
        required: true
        default: 'pre'
        type: choice
        options:
          - pre
          - dev
          - stable

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64

    # 关键修复：根据输入的 platform 过滤
    if: |
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == matrix.platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Setup (Windows - zip only)
        if: matrix.platform == 'windows'
        run: dart setup.dart windows --env ${{ github.event.inputs.env_type }} --targets zip -v

      - name: Setup (Other platforms)
        if: matrix.platform != 'windows'
        run: dart setup.dart ${{ matrix.platform }} --env ${{ github.event.inputs.env_type }} -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          overwrite: true
